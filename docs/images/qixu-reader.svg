  <text x="74" y="153" font-size="41" font-weight="700" fill="#24283d">喜欢的书，读到哪里都算数。</text>
  <text x="78" y="203" font-size="20" fill="#5e6379">导入 TXT / EPUB，留下每次阅读的位置。</text>
