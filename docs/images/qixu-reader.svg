  <text x="903" y="222" font-size="17" fill="#5a5254">阳光刚好落在桌边，</text><text x="903" y="262" font-size="17" fill="#5a5254">读到喜欢的句子，就多停留一会儿。</text><text x="903" y="302" font-size="17" fill="#5a5254">下一次打开，故事仍从这里继续。</text><text x="903" y="343" font-size="17" fill="#5a5254">让阅读回到它最自然的节奏。</text>
