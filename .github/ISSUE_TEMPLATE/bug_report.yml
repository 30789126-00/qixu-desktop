name: 🐛 Bug 反馈
description: 报告可复现的功能问题
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: 栖序版本
      placeholder: 例如 1.7.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 受影响的模块
      options:
        - 待办 / 小组件
        - 视频 / 浏览器
        - 小说阅读
        - 透明 / 隐藏 / 快捷键
        - 翻译 / 字幕
        - 安装 / 自启动
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 请说明操作步骤、预期行为和实际行为。不要提交密码、Cookie 或个人资料。
    validations:
      required: true

